name: Build 7za from Custom Tag

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform }}

      - name: Build and Collect
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Alone
          nmake PLATFORM=${{ matrix.platform }} NEW_COMPILER=1 MY_STATIC_LINK=1
          
          set EXE_PATH=${{ matrix.platform }}\7za.exe
          
          if not exist %EXE_PATH% (
            echo "ERROR: 7za.exe was not generated at %EXE_PATH%!"
            exit 1
          )
          
          cd ../../../..
          mkdir dist || echo "dist already exists"
          
          copy CPP\7zip\Bundles\Alone\%EXE_PATH% dist\7za-${{ matrix.platform }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7za-${{ matrix.platform }}
          path: dist/7za-${{ matrix.platform }}.exe
